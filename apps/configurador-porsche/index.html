<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <title>Atelier · Configurador visual</title>
  <meta name="description" content="Configurador visual para concesionario: elige modelo, color de carrocería, interior, llantas y pinzas y mira cómo queda antes de comprar.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-nav="modelos" aria-label="Inicio">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Atelier<small>Configurador visual</small></span>
    </a>
    <nav class="mainnav" aria-label="Secciones">
      <button data-nav="modelos" class="is-active">Modelos</button>
      <button data-nav="configurar">Configurar</button>
      <button data-nav="comparar">Comparar <span class="badge" id="cmpCount" hidden>0</span></button>
      <button data-nav="garaje">Mis configuraciones <span class="badge" id="garCount" hidden>0</span></button>
      <button data-nav="historia">Historia</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    Herramienta de demostración no oficial. Maquetas ilustrativas: los colores en pantalla son aproximados y los precios, orientativos.
    Confirma siempre especificaciones y tarifa vigente con el concesionario.
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
