<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Mockup 3D de ebook + móvil, 1600×1200. Coloca la portada como portada.png en la misma carpeta (y, si quieres mostrar una página interior en el móvil, cambia el src de .movil).
     python scripts/renderizar.py assets/mockup-libro.html mockup.png --ancho 1600 --alto 1200 -->
<style>
  :root { --fondo1:#FFF8F3; --fondo2:#FFE4DE; --sombra:rgba(42,16,51,.35); }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1600px; height:1200px; overflow:hidden; }
  body { background:radial-gradient(circle at 30% 40%, var(--fondo2), var(--fondo1) 70%); display:flex; align-items:center; justify-content:center; gap:120px; perspective:2400px; }
  .libro { position:relative; width:560px; height:840px; transform:rotateY(-24deg) rotateX(4deg); transform-style:preserve-3d; }
  /* Las capas de sombra simulan el canto de las páginas sin elementos 3D adicionales que puedan desalinearse. */
  .libro .tapa { position:absolute; inset:0; border-radius:4px 14px 14px 4px; overflow:hidden;
    box-shadow:5px 4px 0 -1px #f4eef4, 10px 8px 0 -2px #e7dee8, 15px 12px 0 -3px #f4eef4, 40px 50px 80px var(--sombra); }
  .libro .tapa img { width:100%; height:100%; object-fit:cover; display:block; }
  .libro .tapa::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(0,0,0,.35) 0,rgba(255,255,255,.15) 2.5%,rgba(0,0,0,0) 6%,rgba(255,255,255,.08) 60%,rgba(0,0,0,.05)); }
  .movil { width:330px; height:680px; border-radius:52px; background:#111; padding:16px; box-shadow:30px 40px 70px var(--sombra); transform:rotate(6deg) translateY(60px); }
  .movil .pantalla { width:100%; height:100%; border-radius:38px; overflow:hidden; background:#fff; }
  /* Encuadre desplazado a la izquierda: los títulos de portada suelen ir alineados a la izquierda. */
  .movil img { width:100%; height:100%; object-fit:cover; object-position:20% center; }
</style>
</head>
<body>
  <div class="libro">
    <div class="tapa"><img src="portada.png" alt="Portada del ebook"></div>
  </div>
  <div class="movil"><div class="pantalla"><img src="portada.png" alt="Ebook en el móvil"></div></div>
</body>
</html>
